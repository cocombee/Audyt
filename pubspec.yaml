name: audyt
description: "Local-first accounting for every included accounting workflow."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter_svg: ^2.2.0
  crypto: ^3.0.7
  dartcv4: ^2.3.0
  desktop_drop: ^0.8.2
  file_picker: ^12.1.2
  flutter:
    sdk: flutter
  image: ^4.9.2
  pdf: ^3.13.0
  flutter_quill: 11.6.0
  sqlite3: ^2.9.4
  google_sign_in: 7.2.0
dev_dependencies:
  google_sign_in_platform_interface: 3.1.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Inter-Regular.ttf
    - assets/fonts/Inter-Bold.ttf
    - assets/fonts/Inter-SemiBold.ttf
    - assets/branding/Audyt Logo.svg
    - assets/branding/Rubik License.txt
    - assets/icons/
    - assets/icons/small/
    - assets/icons/reminder_originals/
    - assets/icons/reminder_cropped/
  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-SemiBold.ttf
          weight: 600
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.woff2
          weight: 100
          style: normal
        - asset: assets/fonts/Inter-Variable.woff2
          weight: 900
          style: normal

hooks:
  user_defines:
    dartcv4:
      macos:
        generator: Unix Makefiles
